# Test RTSP server for ReoBaby. Credentials below are throwaway test values.
logLevel: warn
protocols: [tcp]
rtspAuthMethods: [digest]
rtmp: no
hls: no
webrtc: no
srt: no

authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
  - user: tester
    pass: testpass
    ips: []
    permissions:
      - action: read

paths:
  # test/demo/nursery.png (an AI-generated baby, stamped by tools/demo-frame.swift) and a quiet white-noise machine.
  nursery:
    runOnInit: >
      ffmpeg -hide_banner -loglevel error -re
      -loop 1 -framerate 15 -i /demo/nursery.png
      -f lavfi -i anoisesrc=color=brown:sample_rate=16000:amplitude=0.02
      -c:v libx264 -preset veryfast -tune stillimage -g 30 -pix_fmt yuv420p
      -c:a aac -ar 16000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/nursery
    runOnInitRestart: yes
  h264:
    runOnInit: >
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=25
      -f lavfi -i sine=frequency=440:sample_rate=16000
      -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p
      -c:a aac -ar 16000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/h264
    runOnInitRestart: yes
  h265:
    runOnInit: >
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=2560x1440:rate=20
      -f lavfi -i sine=frequency=660:sample_rate=8000
      -c:v libx265 -preset ultrafast -tune zerolatency -x265-params keyint=40:log-level=error:pools=none:frame-threads=1 -pix_fmt yuv420p
      -c:a pcm_alaw -ar 8000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/h265
    runOnInitRestart: yes
  beeps:
    runOnInit: >
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=640x360:rate=15
      -f lavfi -i "anoisesrc=color=pink:sample_rate=16000:amplitude=0.003[n];sine=frequency=880:sample_rate=16000,volume='if(lt(mod(t,6),1),0.5,0)':eval=frame[s];[n][s]amix=inputs=2:normalize=0"
      -c:v libx264 -preset ultrafast -tune zerolatency -g 30 -pix_fmt yuv420p
      -c:a aac -ar 16000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/beeps
    runOnInitRestart: yes
